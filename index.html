<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Слайдер изображений — Лабораторная работа №2</title>
    <!-- Подключаем Swiper CSS (актуальная версия) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Галерея изображений</h1>

        <!-- Основной контейнер слайдера Swiper -->
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <!-- Слайд 1: картинка из интернета (гарантированно работает) -->
                <div class="swiper-slide">
                    <img src="images/photo1.jpg" alt="Пейзаж 1">
                </div>
                <!-- Слайд 2 -->
                <div class="swiper-slide">
                    <img src="images/photo2.jpg" alt="Пейзаж 2">
                </div>
                <!-- Слайд 3 -->
                <div class="swiper-slide">
                    <img src="images/photo3.jpg" alt="Пейзаж 3">
                </div>
                <!-- При желании добавьте больше слайдов, копируя блок .swiper-slide -->
            </div>
            <!-- Навигационные стрелки -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <!-- Пагинация (точки) -->
            <div class="swiper-pagination"></div>
        </div>

        <!-- Блок для информации (опционально) -->
        <div class="info">
            <p>Слайдер работает: листайте стрелками, точками или перетаскивайте мышкой на компьютере / пальцем на смартфоне.</p>
        </div>
    </div>

    <!-- Подключаем Swiper JS (обязательно перед вашим script.js) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
